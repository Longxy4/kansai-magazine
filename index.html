<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>関西通信 | freebird Kansai</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#352c25;background:#eee9e1;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#fff9f1;border-bottom:1px solid #ddd1c4}h1{margin:0;font-size:1rem}.subtitle{font-size:.75rem;color:#806d60;margin-top:3px}button,a.action{font:inherit;color:inherit;border:1px solid #c5b8ab;border-radius:8px;padding:8px 12px;background:#fff;text-decoration:none;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #ce7b28;outline-offset:2px}.tools{display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:7px;padding:12px 8px}.page-number{min-width:95px;text-align:center;font-size:.85rem}.flipbook .viewport{width:100% !important;height:calc(100dvh - 205px) !important;min-height:280px}.flipbook .bounding-box{box-shadow:0 5px 20px #0003}#loading{padding:25px;text-align:center}#error{color:#9a2818;text-align:center;padding:20px}#notice{text-align:center;font-size:.8rem;min-height:1.2em}footer{text-align:center;font-size:.74rem;color:#796d62;padding:8px 12px}footer a{color:inherit}dialog{border:0;border-radius:14px;text-align:center;max-width:90vw;padding:24px}dialog::backdrop{background:#0008}#qr svg{width:230px;max-width:70vw;height:auto;display:block;margin:15px auto}[v-cloak]{display:none}@media(max-width:650px){header{padding:10px 12px}.tools{gap:5px;padding:10px 6px}button,a.action{padding:7px 9px;font-size:.85rem}.flipbook .viewport{height:calc(100dvh - 240px) !important}}
</style>
</head>
<body>
<header><div><h1>関西通信</h1><div class="subtitle">日中学生交流団体 freebird 関西支部</div></div><div id="issueLabel"></div></header>
<div id="loading" role="status">読み込み中…</div>
<div id="error" role="alert" hidden></div>
<div id="app" v-cloak>
<flipbook v-if="pages.length" ref="book" class="flipbook" :pages="pages" :single-page="single" :zooms="[1,2,4]" :flip-duration="650" :zoom-duration="300" v-slot="book">
<div class="tools" aria-label="閲覧操作">
<button @click="book.flipLeft" :disabled="!book.canFlipLeft" aria-label="前のページ">‹ 前へ</button>
<span class="page-number" role="status">{{book.page}} / {{book.numPages}}</span>
<button @click="book.flipRight" :disabled="!book.canFlipRight" aria-label="次のページ">次へ ›</button>
<button @click="book.zoomOut" :disabled="!book.canZoomOut" aria-label="縮小">−</button>
<button @click="book.zoomIn" :disabled="!book.canZoomIn" aria-label="拡大">＋</button>
<button @click="single=!single">{{single?'表示：自動':'表示：単頁'}}</button>
<button @click="full">全画面</button><button @click="share">共有</button><button @click="qr">QR</button><a class="action" :href="pdfUrl" target="_blank" rel="noopener">PDF</a>
</div>
</flipbook>
<div id="notice" role="status">{{notice}}</div>
</div>
<footer>ドラッグ・スワイプで翻頁。クリックで拡大し、拡大後はドラッグで移動。<br>Powered by <a href="https://github.com/ts1/flipbook-vue" target="_blank" rel="noopener">flipbook-vue</a> / PDF.js</footer>
<dialog id="qrModal"><strong>この号のQRコード</strong><div id="qr"></div><button id="closeQR">閉じる</button></dialog>
<script src="./vendor/vue.global.prod.js"></script><script src="./vendor/flipbook-vue.min.js"></script><script src="./vendor/qrcode.js"></script>
<script type="module">
import * as pdfjs from './vendor/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='./vendor/pdf.worker.min.mjs';
const $=id=>document.getElementById(id),issue=new URLSearchParams(location.search).get('issue')||'2026-07';
const valid=/^\d{4}-(0[1-9]|1[0-2])$/.test(issue),pdfUrl='./issues/'+issue+'.pdf';
const shareUrl=new URL(location.href);shareUrl.search='?issue='+issue;shareUrl.hash='';
$('issueLabel').textContent=issue;document.title='関西通信 '+issue+' | freebird Kansai';
const vm=new Vue({
 el:'#app',
 data:()=>({pages:[],single:false,pdfUrl,notice:''}),
 methods:{
  async full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{this.notice='この端末では全画面表示を利用できません'}},
  async share(){try{await navigator.clipboard.writeText(shareUrl.href);this.notice='リンクをコピーしました'}catch{prompt('このリンクをコピー',shareUrl.href)}},
  qr(){const qr=qrcode(0,'M');qr.addData(shareUrl.href);qr.make();$('qr').innerHTML=qr.createSvgTag(5,20);$('qrModal').showModal()}
 }
});

$('closeQR').onclick=()=>$('qrModal').close();
document.addEventListener('keydown',e=>{if($('qrModal').open)return;const book=vm.$refs.book;if(!book)return;if(e.key==='ArrowRight'&&book.canFlipRight)book.flipRight();if(e.key==='ArrowLeft'&&book.canFlipLeft)book.flipLeft()});
// Only the PDF spread-to-image adapter is specific to this magazine.
// flipbook-vue owns page turns, responsive page layout, dragging and zoom.
try{
 if(!valid)throw Error('Invalid issue');
 const pdf=await pdfjs.getDocument(pdfUrl).promise;
 const pages=[null],covers=[];
 for(let n=1;n<=pdf.numPages;n++){
  $('loading').textContent='誌面を準備中 '+n+' / '+pdf.numPages;
  const page=await pdf.getPage(n),base=page.getViewport({scale:1}),viewport=page.getViewport({scale:3200/base.width});
  const spread=document.createElement('canvas');spread.width=Math.ceil(viewport.width);spread.height=Math.ceil(viewport.height);
  await page.render({canvasContext:spread.getContext('2d'),viewport}).promise;
  const halves=[];
  for(let side=0;side<2;side++){
   const x=side?Math.floor(spread.width/2):0,w=side?spread.width-x:Math.floor(spread.width/2);
   const canvas=document.createElement('canvas');canvas.width=w;canvas.height=spread.height;
   canvas.getContext('2d').drawImage(spread,x,0,w,spread.height,0,0,w,spread.height);
   const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));
   if(!blob)throw Error('Image conversion failed');halves.push(URL.createObjectURL(blob));canvas.width=canvas.height=0;
  }
  if(n===1){covers.push(...halves);pages.push(halves[1])}else pages.push(...halves);
  spread.width=spread.height=0;page.cleanup();
 }
 pages.push(covers[0]);vm.pages=pages;$('loading').hidden=true;await pdf.destroy();
}catch(e){$('loading').hidden=true;$('error').hidden=false;$('error').textContent=valid?'PDFを読み込めません。時間をおいて再読み込みするか、PDFファイルを確認してください。':'号数の形式が正しくありません。';console.error(e)}
</script>
</body></html>
